### Минимальный прогон SFT SmolVLM2 на одной карте 12 ГБ.
#
# Отличия от configs/vlm_sft.yaml организатора (все — ради того, чтобы прогон
# поместился в 12 ГБ и сутки времени; при полном протоколе их возвращают):
#   - batch 1 с накоплением 16 вместо 8x14;
#   - заморожен визуальный энкодер;
#   - изображения и контекст урезаны (384px, 2048 токенов);
#   - deepspeed выключен — на одной карте он не нужен.
#
# Ставится на место configs/vlm_sft.yaml в репозитории участника.

### model
model_name_or_path: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
image_max_pixels: 147456
video_max_pixels: 16384
video_fps: 2.0
video_maxlen: 64
trust_remote_code: true
flash_attn: disabled

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
disable_gradient_checkpointing: false
deepspeed: false

### dataset
template: smolvlm2
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
logging_steps: 20
save_strategy: steps
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
seed: 42
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 1.0
warmup_ratio: 0.03
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
