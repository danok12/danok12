name: Публикация сайта — журнал ДЗ и проверка ДЗ

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'proverka-dz/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Включить Pages, если ещё не включены
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Собрать страницу проверки ДЗ в site/proverka
        run: python3 proverka-dz/build_site.py site/proverka
      - name: Собрать содержимое каталога site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Выложить
        id: deployment
        uses: actions/deploy-pages@v4
