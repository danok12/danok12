/* ── страница ─────────────────────────────────────── */
var lk=document.createElement('link');lk.rel='stylesheet';lk.href=FONTS;document.head.appendChild(lk);
var stl=document.createElement('style');stl.textContent=CSS;document.head.appendChild(stl);
var root=document.createElement('div');root.innerHTML=MARKUP;document.body.appendChild(root);
var $=function(s){return root.querySelector(s)};

var students=(DATA&&DATA.students)||[];
var state={filter:'all',q:'',sort:'urgency',sel:new Set(),dirty:false,saving:false,readOnly:false,api:null};
var saved=JSON.stringify(students);
var timer=null;

/* ── даты ─────────────────────────────────────────── */
var WD=['вс','пн','вт','ср','чт','пт','сб'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function plusDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function parseISO(s){var p=String(s||'').split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function daysUntil(s){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((parseISO(s)-a)/86400000)}
function fmt(s){if(!s)return '—';var d=parseISO(s);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+', '+WD[d.getDay()]}
function plur(n,a,b,c){var x=Math.abs(n)%100,y=x%10;if(x>14&&x<20)return c;if(y===1)return a;if(y>1&&y<5)return b;return c}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ── состояние строки ─────────────────────────────── */
function statusOf(s){
  var hw=s.hw;
  if(!hw||!hw.title)return {key:'none',label:'ДЗ не выдано',tone:'grey',rank:5};
  if(hw.status==='done')return {key:'done',label:'Сдано '+fmt(hw.doneAt),tone:'green',rank:4};
  var d=daysUntil(hw.due);
  if(d<0)return {key:'overdue',label:'Просрочено '+(-d)+' '+plur(d,'день','дня','дней'),tone:'red',rank:0};
  if(d===0)return {key:'today',label:'Сдать сегодня',tone:'amber',rank:1};
  if(d===1)return {key:'today',label:'Сдать завтра',tone:'amber',rank:1};
  return {key:'work',label:'Осталось '+d+' '+plur(d,'день','дня','дней'),tone:'petrol',rank:d<=3?2:3};
}
var FILTERS=[{key:'all',name:'Все',tone:null},{key:'overdue',name:'Просрочено',tone:'red'},
  {key:'today',name:'Сегодня–завтра',tone:'amber'},{key:'work',name:'В работе',tone:'petrol'},
  {key:'done',name:'Сдано',tone:'green'},{key:'none',name:'Без ДЗ',tone:'grey'}];

function demoRows(){return [
  {id:'d1',demo:true,name:'Абрамова Ника',group:'11 класс · ЕГЭ база',hw:{title:'Задание 14, вариант 3 — № 1–6',due:plusDays(-2),issued:plusDays(-9),status:'issued',note:''}},
  {id:'d2',demo:true,name:'Гущин Артём',group:'1 курс · линейная алгебра',hw:{title:'§1.5 Обратная матрица, № 1–8',due:today(),issued:plusDays(-7),status:'issued',note:'прислать фото до занятия'}},
  {id:'d3',demo:true,name:'Кравец Соня',group:'11 класс · ЕГЭ база',hw:{title:'Задание 14, вариант 3 — № 1–6',due:plusDays(5),issued:plusDays(-2),status:'issued',note:''}},
  {id:'d4',demo:true,name:'Лапин Егор',group:'1 курс · линейная алгебра',hw:{title:'§1.5 Обратная матрица, № 1–8',due:plusDays(-1),issued:plusDays(-8),status:'done',doneAt:plusDays(-1),note:''}},
  {id:'d5',demo:true,name:'Юсупова Дина',group:'11 класс · ЕГЭ база',hw:null}]}
function isDemo(){return students.length===0}
function data(){return students.length?students:demoRows()}
function byId(id){for(var i=0;i<students.length;i++)if(students[i].id===id)return students[i];return null}

function cmpName(a,b){return (a.s.name||'').localeCompare(b.s.name||'','ru')}
function view(){
  var list=data().map(function(s){return {s:s,st:statusOf(s)}});
  var q=state.q.trim().toLowerCase();
  if(q)list=list.filter(function(r){
    return (r.s.name||'').toLowerCase().indexOf(q)>=0||(r.s.group||'').toLowerCase().indexOf(q)>=0});
  if(state.filter!=='all')list=list.filter(function(r){return r.st.key===state.filter});
  var by=state.sort;
  list.sort(function(a,b){
    if(by==='name')return cmpName(a,b);
    if(by==='group'){var g=(a.s.group||'я').localeCompare(b.s.group||'я','ru');return g||cmpName(a,b)}
    if(by==='due'){var da=a.s.hw&&a.s.hw.due||'9999',db=b.s.hw&&b.s.hw.due||'9999';return da<db?-1:da>db?1:cmpName(a,b)}
    if(a.st.rank!==b.st.rank)return a.st.rank-b.st.rank;
    var x=a.s.hw&&a.s.hw.due||'9999',y=b.s.hw&&b.s.hw.due||'9999';
    return x<y?-1:x>y?1:cmpName(a,b)});
  return list;
}

/* ── сохранение: страница переиздаёт сама себя ────── */
function jsonLit(o){return JSON.stringify(o).replace(/</g,'\\u003c')
  .replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')}
function buildDoc(){
  var payload={students:students,rev:((DATA&&DATA.rev)||0)+1,savedAt:new Date().toISOString()};
  return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>Журнал ДЗ</title>\n</head>\n<body>\n<script>\nvar DATA = '+jsonLit(payload)+';\n'+
    APP.toString()+'\nAPP(DATA);\n<\/script>\n</body>\n</html>';
}
function touch(){
  if(state.readOnly)return;
  state.dirty=true;renderSave();
  clearTimeout(timer);timer=setTimeout(flush,2000);
}
function flush(){
  clearTimeout(timer);
  if(!state.dirty||state.saving||state.readOnly)return;
  if(!state.api){state.readOnly=true;rollback('Эта копия страницы не сохраняет изменения');return}
  state.saving=true;renderSave();render();
  state.api.publish(buildDoc()).then(function(){
    /* страница перезагрузится на новую версию */
  }).catch(function(e){
    state.saving=false;
    var c=e&&e.code;
    if(c==='conflict'){toast('Кто-то сохранил раньше — страница обновится на его версию')}
    else if(c==='not_writer'||c==='not_granted'){state.readOnly=true;rollback('Только просмотр: сохранять изменения может владелец страницы')}
    else{toast('Сохранить не удалось, попробуйте ещё раз')}
    renderSave();render();
  });
}
function rollback(msg){
  students=JSON.parse(saved);state.dirty=false;state.sel.clear();
  banner('<b>Только просмотр.</b> '+esc(msg)+' Таблица показывает последнюю сохранённую версию.','amber');
  renderSave();render();
}
function renderSave(){
  var el=$('#save'),btn=$('#save-now');
  if(state.readOnly){el.innerHTML='<i></i><b>только просмотр</b>';el.style.setProperty('--tone','var(--ink-3)');btn.hidden=true;return}
  if(state.saving){el.innerHTML='<i></i><b>сохраняю…</b>';el.style.setProperty('--tone','var(--petrol)');btn.hidden=true;return}
  if(state.dirty){el.innerHTML='<i></i><b>есть несохранённое</b>';el.style.setProperty('--tone','var(--amber)');btn.hidden=false;return}
  var t=DATA&&DATA.savedAt?new Date(DATA.savedAt):null;
  el.innerHTML='<i></i><b>сохранено'+(t?' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'):'')+'</b>';
  el.style.setProperty('--tone','var(--green)');btn.hidden=true;
}

/* ── отрисовка ────────────────────────────────────── */
function render(){
  $('#today').textContent='Сегодня '+fmt(today());
  var all=data().map(statusOf),counts={all:all.length};
  FILTERS.forEach(function(f){if(f.key!=='all')counts[f.key]=0});
  all.forEach(function(st){counts[st.key]=(counts[st.key]||0)+1});
  $('#chips').innerHTML=FILTERS.map(function(f){
    var style=f.tone?('--tone:var(--'+f.tone+');--tone-tint:var(--'+f.tone+'-tint)')
      :'--tone:var(--petrol);--tone-tint:var(--petrol-tint)';
    return '<button class="chip" data-filter="'+f.key+'" aria-pressed="'+(state.filter===f.key)+'" style="'+style+'">'+
      (f.tone?'<i class="dot"></i>':'')+esc(f.name)+' <span class="n">'+(counts[f.key]||0)+'</span></button>'}).join('');

  var rows=view(),demo=isDemo(),lock=demo||state.readOnly||state.saving;
  $('#rows').innerHTML=rows.map(function(r){
    var s=r.s,st=r.st,hw=s.hw&&s.hw.title?s.hw:null;
    var act=st.key==='none'?'Выдать ДЗ':st.key==='done'?'Выдать ещё':'Сдал ✓';
    var an=st.key==='none'||st.key==='done'?'issue':'done';
    return '<tr data-tone="'+st.tone+'" data-id="'+esc(s.id)+'"'+(state.sel.has(s.id)?' class="sel"':'')+
      (demo?' style="opacity:.62"':'')+'>'+
      '<td class="c-check"><input type="checkbox" data-pick="'+esc(s.id)+'" aria-label="Выбрать: '+esc(s.name)+'"'+
        (state.sel.has(s.id)?' checked':'')+(lock?' disabled':'')+'></td>'+
      '<td class="c-name">'+esc(s.name)+(demo?'<span class="demo-tag">пример</span>':'')+
        (s.group?'<span class="grp">'+esc(s.group)+'</span>':'')+'</td>'+
      '<td class="c-task" data-label="Что сдать">'+(hw?esc(hw.title)+(hw.note?'<span class="note">'+esc(hw.note)+'</span>':'')
        :'<span class="nothing">задание не выдано</span>')+'</td>'+
      '<td class="c-issued mono" data-label="Выдано">'+(hw&&hw.issued?fmt(hw.issued):'—')+'</td>'+
      '<td class="c-due" data-label="Срок">'+(hw?'<div class="mono">'+fmt(hw.due)+'</div>':'')+
        '<span class="pill">'+esc(st.label)+'</span></td>'+
      '<td class="c-act"><button data-act="'+an+'" data-id="'+esc(s.id)+'"'+(lock?' disabled':'')+
        (an==='done'?' class="primary"':'')+'>'+act+'</button>'+
        '<button class="ghost more" data-act="card" data-id="'+esc(s.id)+'" aria-label="Карточка ученика"'+
        (demo||state.saving?' disabled':'')+'>⋯</button></td></tr>'}).join('');

  $('#empty').innerHTML=demo
    ? '<div class="panel"><h2>Пока это пример</h2><p>Пять строк ниже показаны для примера: так выглядит журнал в работе. Нажмите «+ Ученики» и вставьте список ФИО — примеры исчезнут, а строки станут вашими.</p>'+
      (state.readOnly?'':'<button class="primary" data-open-add>Вставить список учеников</button>')+'</div>'
    : (rows.length?'':'<div class="panel"><h2>В этом фильтре пусто</h2><p>Ни один ученик не попадает под выбранный фильтр или поиск.</p><button data-reset>Показать всех</button></div>');

  $('#foot').innerHTML=state.readOnly
    ? 'Страница открыта только для чтения: отметки ставит владелец журнала, здесь видна последняя сохранённая версия.'
    : 'Отметки сохраняются в самой странице — через пару секунд после последнего изменения она переиздаётся, и все открытые копии обновляются. Строка без цвета слева — человек сидит без задания.';

  var n=state.sel.size;
  $('#bulk').hidden=n===0;
  $('#bulk-n').textContent=n;
  $('#bulk-word').textContent=plur(n,'ученик выбран','ученика выбрано','учеников выбрано');
  var ids=rows.map(function(r){return r.s.id});
  $('#all').checked=ids.length>0&&ids.every(function(i){return state.sel.has(i)});
  $('#all').disabled=lock;
  $('#btn-add').disabled=state.readOnly||state.saving;

  var seen={},t=[];
  students.forEach(function(s){
    if(s.hw&&s.hw.title&&!seen[s.hw.title]){seen[s.hw.title]=1;t.push(s.hw.title)}
    (s.done||[]).forEach(function(h){if(h.title&&!seen[h.title]){seen[h.title]=1;t.push(h.title)}})});
  $('#titles').innerHTML=t.slice(0,25).map(function(x){return '<option value="'+esc(x)+'">'}).join('');
}
function banner(html,tone){
  $('#banner').innerHTML=html?'<div class="banner"'+(tone?' style="--tone:var(--'+tone+');--tone-tint:var(--'+tone+'-tint)"':'')+'>'+html+'</div>':''}
var toastT;
function toast(msg){
  var el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=msg;clearTimeout(toastT);toastT=setTimeout(function(){el.remove()},3600)}

/* ── действия ─────────────────────────────────────── */
function markDone(id){var s=byId(id);if(!s||!s.hw)return;
  s.hw.status='done';s.hw.doneAt=today();touch();render()}
function unDone(id){var s=byId(id);if(!s||!s.hw)return;
  s.hw.status='issued';delete s.hw.doneAt;touch();render()}
function shelve(s){
  if(s.hw&&s.hw.title){s.done=(s.done||[]);
    s.done.unshift({title:s.hw.title,due:s.hw.due,status:s.hw.status||'issued',doneAt:s.hw.doneAt||null});
    s.done=s.done.slice(0,15)}}
function issueTo(ids,d){
  ids.forEach(function(id){var s=byId(id);if(!s)return;shelve(s);
    s.hw={title:d.title,due:d.due,note:d.note||'',issued:today(),status:'issued'}});
  state.sel.clear();touch();render();
  toast('ДЗ выдано: '+ids.length+' '+plur(ids.length,'ученику','ученикам','ученикам'))}
function removeHw(id){var s=byId(id);if(!s)return;shelve(s);s.hw=null;touch();render()}

var issueTargets=[];
function openIssue(ids){
  if(state.readOnly){toast('Сохранять изменения может только владелец страницы');return}
  issueTargets=ids;
  var who=ids.length===1?(byId(ids[0])||{}).name:ids.length+' '+plur(ids.length,'ученик','ученика','учеников');
  $('#issue-who').textContent='Кому: '+who;
  $('#i-title').value='';$('#i-note').value='';$('#i-due').value=plusDays(7);
  $('#dlg-issue').showModal();setTimeout(function(){$('#i-title').focus()},30)}
var cardId=null;
function openCard(id){
  var s=byId(id);if(!s)return;cardId=id;
  var st=statusOf(s),hw=s.hw&&s.hw.title?s.hw:null;
  var h='<h2>'+esc(s.name)+'</h2><p class="sub">'+(s.group?esc(s.group):'группа не указана')+'</p>'+
    '<label class="field"><span>ФИО</span><input type="text" id="c-name" value="'+esc(s.name)+'"></label>'+
    '<label class="field"><span>Группа</span><input type="text" id="c-group" value="'+esc(s.group||'')+'"></label>';
  if(hw){h+='<label class="field"><span>Текущее ДЗ</span><input type="text" id="c-title" value="'+esc(hw.title)+'"></label>'+
    '<label class="field"><span>Срок — сейчас '+esc(st.label.toLowerCase())+'</span><input type="date" id="c-due" value="'+esc(hw.due)+'"></label>'+
    '<label class="field"><span>Примечание</span><input type="text" id="c-note" value="'+esc(hw.note||'')+'"></label>'+
    '<div class="quick"><button type="button" data-card="extend" data-d="3">продлить на 3 дня</button>'+
    '<button type="button" data-card="extend" data-d="7">продлить на неделю</button>'+
    (hw.status==='done'?'<button type="button" data-card="undone">снять «сдано»</button>'
      :'<button type="button" data-card="done">отметить сдано</button>')+
    '<button type="button" data-card="rmhw">убрать ДЗ</button></div>'}
  else h+='<p class="sub">Сейчас задания нет.</p><div class="quick"><button type="button" data-card="issue">выдать ДЗ</button></div>';
  var hist=(s.done||[]).filter(function(x){return x&&x.title});
  if(hist.length)h+='<p class="sub" style="margin-top:16px">Раньше</p><ul class="hist">'+hist.map(function(x){
    return '<li><span>'+esc(x.title)+'</span><span class="mono">'+(x.status==='done'?'сдано '+fmt(x.doneAt||x.due):'срок '+fmt(x.due))+'</span></li>'}).join('')+'</ul>';
  h+='<div class="dlg-act"><button type="button" class="danger" data-card="del">Удалить ученика</button>'+
     '<button type="button" data-close>Закрыть</button>'+
     '<button type="button" class="primary" data-card="save">Сохранить</button></div>';
  $('#card-body').innerHTML=h;$('#dlg-card').showModal()}

/* ── события ──────────────────────────────────────── */
root.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.close!==undefined){t.closest('dialog').close();return}
  if(t.dataset.filter){state.filter=t.dataset.filter;remember();render();return}
  if(t.dataset.openAdd!==undefined){$('#dlg-add').showModal();return}
  if(t.dataset.reset!==undefined){state.filter='all';state.q='';$('#q').value='';render();return}
  if(t.dataset.plus){$('#i-due').value=plusDays(+t.dataset.plus);return}
  var act=t.dataset.act,id=t.dataset.id;
  if(act==='done')return markDone(id);
  if(act==='issue')return openIssue([id]);
  if(act==='card')return openCard(id);
  var c=t.dataset.card;if(!c)return;
  var s=byId(cardId);if(!s)return;
  if(c==='save'){s.name=$('#c-name').value.trim()||s.name;s.group=$('#c-group').value.trim();
    if(s.hw&&s.hw.title){s.hw.title=$('#c-title').value.trim()||s.hw.title;
      s.hw.due=$('#c-due').value||s.hw.due;s.hw.note=$('#c-note').value.trim()}
    touch();render();$('#dlg-card').close();return}
  if(c==='extend'){var d=parseISO(s.hw.due);d.setDate(d.getDate()+(+t.dataset.d));s.hw.due=iso(d);
    touch();render();$('#dlg-card').close();toast('Срок сдвинут на '+fmt(s.hw.due));return}
  if(c==='done'){markDone(cardId);$('#dlg-card').close();return}
  if(c==='undone'){unDone(cardId);$('#dlg-card').close();return}
  if(c==='rmhw'){removeHw(cardId);$('#dlg-card').close();return}
  if(c==='issue'){$('#dlg-card').close();openIssue([cardId]);return}
  if(c==='del'){if(!confirm('Удалить '+s.name+' вместе с историей ДЗ?'))return;
    students=students.filter(function(x){return x.id!==cardId});
    state.sel.delete(cardId);touch();render();$('#dlg-card').close();return}
});
root.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.pick){el.checked?state.sel.add(el.dataset.pick):state.sel.delete(el.dataset.pick);render();return}
  if(el.id==='all'){var ids=view().map(function(r){return r.s.id});
    ids.forEach(function(i){el.checked?state.sel.add(i):state.sel.delete(i)});render();return}
  if(el.id==='sort'){state.sort=el.value;remember();render()}
});
$('#q').addEventListener('input',function(){state.q=this.value;render()});
$('#save-now').addEventListener('click',flush);
$('#btn-add').addEventListener('click',function(){
  if(state.readOnly){toast('Сохранять изменения может только владелец страницы');return}
  $('#dlg-add').showModal();setTimeout(function(){$('#a-names').focus()},30)});
$('#bulk-issue').addEventListener('click',function(){openIssue(Array.from(state.sel))});
$('#bulk-clear').addEventListener('click',function(){state.sel.clear();render()});
$('#bulk-done').addEventListener('click',function(){
  var ids=Array.from(state.sel).filter(function(id){var s=byId(id);return s&&s.hw&&s.hw.title&&s.hw.status!=='done'});
  if(!ids.length){toast('Среди выбранных некому ставить отметку');return}
  ids.forEach(function(id){var s=byId(id);s.hw.status='done';s.hw.doneAt=today()});
  state.sel.clear();touch();render();toast('Отмечено сдано: '+ids.length)});
$('#form-issue').addEventListener('submit',function(e){
  var title=$('#i-title').value.trim(),due=$('#i-due').value;
  if(!title||!due){e.preventDefault();return}
  issueTo(issueTargets.slice(),{title:title,due:due,note:$('#i-note').value.trim()})});
$('#form-add').addEventListener('submit',function(){
  var names=$('#a-names').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
  var group=$('#a-group').value.trim();$('#a-names').value='';
  if(!names.length)return;
  names.forEach(function(n){students.push({id:uid(),name:n,group:group,hw:null,done:[]})});
  touch();render();toast('Добавлено: '+names.length+' '+plur(names.length,'ученик','ученика','учеников'))});
$('#btn-csv').addEventListener('click',function(){
  var rows=[['Ученик','Группа','Что сдать','Выдано','Срок','Состояние','Примечание']];
  view().forEach(function(r){var s=r.s,hw=s.hw||{};
    rows.push([s.name||'',s.group||'',hw.title||'',hw.issued||'',hw.due||'',r.st.label,hw.note||''])});
  var csv='﻿'+rows.map(function(r){return r.map(function(c){
    return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
  (function(){
    var p=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
    p.then(function(dl){
      if(!dl){toast('Выгрузка файлов в этом просмотре недоступна');return}
      return dl.save({filename:'zhurnal-dz-'+today()+'.csv',data:csv})
        .then(function(){toast('Файл сохранён')})
        .catch(function(e){if(!e||e.code!=='declined')toast('Сохранить файл не удалось')})})})()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.sel.size){state.sel.clear();render()}});
window.addEventListener('beforeunload',function(e){if(state.dirty&&!state.readOnly){e.preventDefault();e.returnValue=''}});

function remember(){try{localStorage.setItem('dz-view',JSON.stringify({f:state.filter,s:state.sort}))}catch(e){}}
try{var m=JSON.parse(localStorage.getItem('dz-view')||'{}');
  if(m.f)state.filter=m.f;if(m.s){state.sort=m.s;$('#sort').value=m.s}}catch(e){}

renderSave();render();
(function(){
  var p=window.claude&&window.claude.use?window.claude.use('artifact'):Promise.resolve(null);
  p.then(function(api){
    state.api=api;
    if(!api){state.readOnly=true;
      banner('<b>Только просмотр.</b> Эта копия страницы не может сохранять изменения — открыта последняя сохранённая версия.','amber');
      renderSave();render()}
  });
})();
}
APP(DATA);
</script>
