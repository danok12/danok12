# Запуск всех локальных компонентов решения одной командой:
#   docker compose up --build
# Проверка сценария без доступа к платформе MAX (со стендом-эмулятором):
#   docker compose --env-file .env.demo --profile demo up --build

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: profil10-api:1.0.0
    environment:
      APP_SECRET: ${APP_SECRET:?нужно задать APP_SECRET, см. .env.example}
      INTERNAL_KEY: ${INTERNAL_KEY:?нужно задать INTERNAL_KEY, см. .env.example}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MIN_AGGREGATE: ${MIN_AGGREGATE:-5}
      MAX_FIELDS: ${MAX_FIELDS:-8}
      REMINDER_DAYS_BEFORE: ${REMINDER_DAYS_BEFORE:-3}
      REMINDER_DEMO_DELAY: ${REMINDER_DEMO_DELAY:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - profil10-data:/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: profil10-bot:1.0.0
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?нужно задать токен чат-бота MAX, см. .env.example}
      MAX_API_BASE: ${MAX_API_BASE:-https://botapi.max.ru}
      MINIAPP_BUTTON_TYPE: ${MINIAPP_BUTTON_TYPE:-link}
      API_BASE_URL: http://api:8080
      INTERNAL_KEY: ${INTERNAL_KEY:?нужно задать INTERNAL_KEY, см. .env.example}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Стенд-эмулятор Bot API MAX. Поднимается только с профилем demo и нужен
  # для локальной проверки сценария без доступа к платформе.
  maxstand:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: tools/mockmax/Dockerfile
    image: profil10-maxstand:1.0.0
    ports:
      - "${STAND_PORT:-8081}:8081"
    restart: unless-stopped

volumes:
  profil10-data:
